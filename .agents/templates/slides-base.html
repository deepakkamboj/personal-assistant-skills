<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}} — Pixel Slides</title>

  <!-- Reveal.js CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css" id="theme" />
  <!-- Highlight.js for code -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css" />

  <style>
    /* ── Brand overrides ─────────────────────────── */
    :root {
      --primary:    #6366f1;
      --secondary:  #06b6d4;
      --accent:     #f59e0b;
      --bg:         #0f172a;
      --surface:    #1e293b;
      --text:       #f1f5f9;
      --muted:      #94a3b8;
    }

    .reveal-viewport { background: var(--bg); }

    .reveal .slides section {
      text-align: left;
    }

    .reveal h1, .reveal h2, .reveal h3 {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-transform: none;
      color: var(--text);
    }

    .reveal h1 { font-size: 2.4em; line-height: 1.1; }
    .reveal h2 { font-size: 1.6em; color: var(--primary); }
    .reveal h3 { font-size: 1.2em; color: var(--secondary); }

    .reveal p, .reveal li { font-size: 0.85em; color: var(--muted); line-height: 1.7; }
    .reveal strong { color: var(--text); }

    /* Cover slide */
    .slide-cover {
      height: 100%;
      display: flex !important;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-left: 4px solid var(--primary);
      padding-left: 2rem !important;
    }

    .slide-cover .eyebrow {
      font-size: 0.5em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--secondary);
      margin-bottom: 0.5rem;
    }

    .slide-cover h1 { color: var(--text); }
    .slide-cover .subtitle { color: var(--muted); font-size: 0.75em; margin-top: 1rem; }
    .slide-cover .meta { color: var(--muted); font-size: 0.5em; margin-top: 2rem; opacity: 0.6; }

    /* Author photo on cover/closing slides */
    .cover-author {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 2rem;
    }
    .cover-author img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      object-fit: cover;
      flex-shrink: 0;
    }
    .cover-author .author-text { line-height: 1.3; }
    .cover-author .author-name { font-size: 0.65em; font-weight: 700; color: var(--text); }
    .cover-author .author-title { font-size: 0.5em; color: var(--muted); }

    /* Highlight chip */
    .chip {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      font-size: 0.45em;
      font-weight: 600;
      padding: 0.25em 0.75em;
      border-radius: 999px;
      vertical-align: middle;
      margin-left: 0.5em;
    }

    /* Stat card */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    .stat-card {
      background: var(--surface);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }
    .stat-card .value { font-size: 2em; font-weight: 800; color: var(--primary); }
    .stat-card .label { font-size: 0.55em; color: var(--muted); margin-top: 0.25rem; }

    /* Timeline */
    .timeline { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
    .timeline-item { display: flex; gap: 1rem; align-items: flex-start; }
    .timeline-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--primary); flex-shrink: 0; margin-top: 4px; }
    .timeline-content .title { font-size: 0.7em; font-weight: 600; color: var(--text); }
    .timeline-content .desc { font-size: 0.55em; color: var(--muted); }

    /* Code block */
    .reveal pre { width: 100%; border-radius: 8px; }
    .reveal code { font-family: 'Fira Code', monospace; }

    /* Two-column layout */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: center; }

    /* Quote */
    .blockquote {
      border-left: 3px solid var(--primary);
      padding-left: 1rem;
      font-style: italic;
      color: var(--text);
    }

    /* Progress bar */
    .reveal .progress { color: var(--primary); height: 3px; }

    /* Slide number */
    .reveal .slide-number { color: var(--muted); font-size: 0.8em; }
  </style>
</head>
<body>
<div class="reveal">
  <div class="slides">

    <!-- ══ SLIDE 1: COVER ══════════════════════════════════ -->
    <section class="slide-cover">
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1>{{TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
      <div class="cover-author">
        <img src="../../../photos/author.png" alt="{{AUTHOR}}" />
        <div class="author-text">
          <div class="author-name">{{AUTHOR}}</div>
          <div class="author-title">{{AUTHOR_TITLE}} · {{DATE}}</div>
        </div>
      </div>
    </section>

    <!-- ══ SLIDE 2: AGENDA ════════════════════════════════ -->
    <section>
      <h2>Agenda</h2>
      <ol>
        <li>{{AGENDA_1}}</li>
        <li>{{AGENDA_2}}</li>
        <li>{{AGENDA_3}}</li>
        <li>{{AGENDA_4}}</li>
      </ol>
    </section>

    <!-- ══ SLIDE 3+: CONTENT ══════════════════════════════ -->
    <!-- Content slides generated here by /pixel slides -->

    <!-- ══ LAST SLIDE: THANK YOU ══════════════════════════ -->
    <section class="slide-cover">
      <div class="eyebrow">Thank You</div>
      <h1>{{CLOSING_TITLE}}</h1>
      <p class="subtitle">{{CLOSING_SUBTITLE}}</p>
      <div class="cover-author">
        <img src="../../../photos/author.png" alt="{{AUTHOR}}" />
        <div class="author-text">
          <div class="author-name">{{AUTHOR}}</div>
          <div class="author-title">{{LINKEDIN_URL}} · {{WEBSITE}}</div>
        </div>
      </div>
    </section>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
<script>
  Reveal.initialize({
    hash: true,
    progress: true,
    slideNumber: 'c/t',
    transition: 'fade',
    transitionSpeed: 'fast',
    backgroundTransition: 'fade',
    plugins: [RevealHighlight, RevealNotes, RevealMarkdown],
    width: 1920, height: 1080,
    margin: 0.08,
    minScale: 0.2, maxScale: 2.0
  });
</script>
</body>
</html>
