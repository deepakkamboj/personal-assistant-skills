<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}} — Pixel Diagram</title>
  <!-- Mermaid.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg:      #0f172a;
      --surface: #1e293b;
      --border:  #334155;
      --text:    #f1f5f9;
      --muted:   #94a3b8;
      --primary: #6366f1;
      --secondary:#06b6d4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.5rem 2rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .type-badge {
      background: var(--primary);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; color: var(--text); }
    header p  { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .toolbar button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.75rem;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .toolbar button:hover { border-color: var(--primary); color: var(--text); }
    .toolbar .sep { flex: 1; }
    .toolbar .theme-label { font-size: 0.7rem; color: var(--muted); }

    /* Diagram canvas */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      overflow: auto;
    }
    .diagram-wrap {
      max-width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .mermaid { max-width: 100%; }

    /* Code view toggle */
    .code-panel {
      display: none;
      padding: 1.5rem 2rem;
      background: #0a0f1e;
      border-top: 1px solid var(--border);
    }
    .code-panel.visible { display: block; }
    .code-panel pre {
      font-family: 'Fira Code', 'Cascadia Code', monospace;
      font-size: 0.8rem;
      color: #a5b4fc;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Footer */
    footer {
      padding: 0.75rem 2rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<header>
  <div>
    <span class="type-badge">{{DIAGRAM_TYPE}}</span>
    <h1>{{TITLE}}</h1>
    <p>{{DESCRIPTION}}</p>
  </div>
</header>

<div class="toolbar">
  <button onclick="zoomIn()">+ Zoom In</button>
  <button onclick="zoomOut()">− Zoom Out</button>
  <button onclick="resetZoom()">Reset</button>
  <button onclick="toggleCode()">{ } Source</button>
  <button onclick="exportSVG()">↓ Export SVG</button>
  <div class="sep"></div>
  <span class="theme-label">Theme:</span>
  <button onclick="setTheme('dark')">Dark</button>
  <button onclick="setTheme('light')">Light</button>
  <button onclick="setTheme('forest')">Forest</button>
</div>

<main>
  <div class="diagram-wrap" id="diagramWrap">
    <div class="mermaid" id="mermaidEl">
{{MERMAID_CODE}}
    </div>
  </div>
</main>

<div class="code-panel" id="codePanel">
  <pre id="codeSource">{{MERMAID_CODE}}</pre>
</div>

<footer>
  <span>Generated by Pixel · /pixel diagram · {{DATE}}</span>
  <span>{{AUTHOR}}</span>
</footer>

<script>
  // ── Mermaid init ─────────────────────────
  let currentTheme = 'dark';
  mermaid.initialize({
    startOnLoad: true,
    theme: 'dark',
    themeVariables: {
      primaryColor:       '#6366f1',
      primaryTextColor:   '#f1f5f9',
      primaryBorderColor: '#4f46e5',
      lineColor:          '#94a3b8',
      secondaryColor:     '#1e293b',
      tertiaryColor:      '#334155',
      background:         '#0f172a',
      nodeBorder:         '#6366f1',
      clusterBkg:         '#1e293b',
      titleColor:         '#f1f5f9',
      edgeLabelBackground:'#1e293b',
      fontFamily:         'Inter, system-ui, sans-serif'
    },
    flowchart: { curve: 'basis', padding: 20 },
    sequence:  { actorMargin: 60 }
  });

  // ── Zoom ─────────────────────────────────
  let scale = 1;
  function zoomIn()    { scale = Math.min(scale + 0.15, 3);   applyZoom(); }
  function zoomOut()   { scale = Math.max(scale - 0.15, 0.3); applyZoom(); }
  function resetZoom() { scale = 1; applyZoom(); }
  function applyZoom() {
    document.getElementById('diagramWrap').style.transform = `scale(${scale})`;
    document.getElementById('diagramWrap').style.transformOrigin = 'top center';
  }

  // ── Code toggle ──────────────────────────
  function toggleCode() {
    document.getElementById('codePanel').classList.toggle('visible');
  }

  // ── Theme switch ─────────────────────────
  function setTheme(theme) {
    currentTheme = theme;
    mermaid.initialize({ startOnLoad: false, theme });
    const el = document.getElementById('mermaidEl');
    el.removeAttribute('data-processed');
    mermaid.run({ querySelector: '#mermaidEl' });
  }

  // ── SVG export ───────────────────────────
  function exportSVG() {
    const svg = document.querySelector('#mermaidEl svg');
    if (!svg) { alert('Diagram not rendered yet.'); return; }
    const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '{{FILENAME}}.svg';
    a.click();
  }
</script>
</body>
</html>
