<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Publishing flow</title>
  <desc id="d">Config and content feed a skill that drafts content, humanizes and checks readability, then publishes via the connected-workspace MCP or deploys via FTP.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#0d1117"/>
  <text x="480" y="42" fill="#f0f6fc" font-size="20" font-weight="700" text-anchor="middle">Publishing flow</text>

  <g font-size="12.5" text-anchor="middle">
    <rect x="30" y="120" width="150" height="60" rx="10" fill="#161b22" stroke="#388bfd"/>
    <text x="105" y="146" fill="#f0f6fc">config + content</text>
    <text x="105" y="164" fill="#8b949e" font-size="11">profile · brand · voice</text>

    <rect x="230" y="120" width="150" height="60" rx="10" fill="#161b22" stroke="#6366f1"/>
    <text x="305" y="146" fill="#f0f6fc">skill</text>
    <text x="305" y="164" fill="#8b949e" font-size="11">me · linkedin · newsletter</text>

    <rect x="430" y="120" width="160" height="60" rx="10" fill="#161b22" stroke="#d9a441"/>
    <text x="510" y="146" fill="#f0f6fc">humanize +</text>
    <text x="510" y="164" fill="#8b949e" font-size="11">readability check</text>

    <rect x="640" y="86" width="150" height="52" rx="10" fill="#161b22" stroke="#0a7ea4"/>
    <text x="715" y="112" fill="#f0f6fc">publish (MCP)</text>
    <text x="715" y="128" fill="#8b949e" font-size="11">Gmail · LinkedIn</text>

    <rect x="640" y="162" width="150" height="52" rx="10" fill="#161b22" stroke="#2ead33"/>
    <text x="715" y="188" fill="#f0f6fc">deploy (FTP)</text>
    <text x="715" y="204" fill="#8b949e" font-size="11">newsletter HTML</text>

    <rect x="840" y="120" width="100" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="890" y="146" fill="#f0f6fc">audience</text>
    <text x="890" y="164" fill="#8b949e" font-size="11">+ tracking</text>
  </g>

  <g stroke="#6366f1" stroke-width="1.7" fill="none" marker-end="url(#a)">
    <path d="M180,150 L228,150"/>
    <path d="M380,150 L428,150"/>
    <path d="M590,145 L638,118"/>
    <path d="M590,155 L638,184"/>
    <path d="M790,112 L845,145"/>
    <path d="M790,188 L845,155"/>
  </g>
</svg>
