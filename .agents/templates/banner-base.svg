<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <!-- Brand gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>

    <!-- Warm gradient -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path for outer canvas -->
    <clipPath id="roundedClip">
      <rect width="1200" height="628" rx="0" ry="0"/>
    </clipPath>

    <!-- Circular clip for author photo -->
    <clipPath id="photoClip">
      <circle cx="980" cy="314" r="185"/>
    </clipPath>

    <!-- Photo glow filter -->
    <filter id="photoGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="628" fill="url(#bgGrad)" clip-path="url(#roundedClip)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="314" x2="1200" y2="314"/>
    <line x1="0" y1="471" x2="1200" y2="471"/>
    <line x1="300" y1="0" x2="300" y2="628"/>
    <line x1="600" y1="0" x2="600" y2="628"/>
    <line x1="900" y1="0" x2="900" y2="628"/>
  </g>

  <!-- Photo backdrop glow ring -->
  <circle cx="980" cy="314" r="210" fill="url(#accentGrad)" opacity="0.08" filter="url(#photoGlow)"/>

  <!-- Outer decorative ring (gradient stroke) -->
  <circle cx="980" cy="314" r="200" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.7"/>

  <!-- Mid ring (subtler) -->
  <circle cx="980" cy="314" r="218" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.25"/>

  <!-- Author photo — circular, right side -->
  <image href="../../../photos/author.png"
         x="795" y="129" width="370" height="370"
         clip-path="url(#photoClip)"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="628" fill="url(#accentGrad)"/>

  <!-- Top-left: Eyebrow / category label -->
  <rect x="60" y="60" width="180" height="32" rx="16" fill="url(#accentGrad)" opacity="0.15"/>
  <text x="150" y="82" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600"
        fill="#6366f1" text-anchor="middle" letter-spacing="1">{{EYEBROW}}</text>

  <!-- Main heading (line 1) -->
  <text x="60" y="200" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="800"
        fill="#f1f5f9" letter-spacing="-2">{{TITLE_LINE_1}}</text>

  <!-- Main heading (line 2) — gradient fill -->
  <text x="60" y="285" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="800"
        fill="url(#accentGrad)" letter-spacing="-2">{{TITLE_LINE_2}}</text>

  <!-- Subheading -->
  <text x="60" y="355" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="400"
        fill="#94a3b8">{{SUBTITLE}}</text>

  <!-- Divider line -->
  <rect x="60" y="395" width="80" height="3" rx="2" fill="url(#accentGrad)"/>

  <!-- Author / attribution -->
  <text x="60" y="440" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600"
        fill="#f1f5f9">{{AUTHOR_NAME}}</text>
  <text x="60" y="465" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="400"
        fill="#64748b">{{AUTHOR_TITLE}}</text>

  <!-- Tag/badge row -->
  <!-- Tag 1 -->
  <rect x="60" y="510" width="120" height="30" rx="15" fill="#6366f1" opacity="0.2"/>
  <text x="120" y="530" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600"
        fill="#a5b4fc" text-anchor="middle">#{{TAG_1}}</text>
  <!-- Tag 2 -->
  <rect x="195" y="510" width="120" height="30" rx="15" fill="#06b6d4" opacity="0.2"/>
  <text x="255" y="530" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600"
        fill="#67e8f9" text-anchor="middle">#{{TAG_2}}</text>
  <!-- Tag 3 -->
  <rect x="330" y="510" width="120" height="30" rx="15" fill="#f59e0b" opacity="0.2"/>
  <text x="390" y="530" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600"
        fill="#fcd34d" text-anchor="middle">#{{TAG_3}}</text>

  <!-- Date bottom right -->
  <text x="1140" y="590" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400"
        fill="#475569" text-anchor="end">{{DATE}}</text>

</svg>
