<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Skill map</title>
  <desc id="d">The 24 skills grouped into AI digest, daily briefing, personal branding, LinkedIn, email, writing, and visual artifacts.</desc>
  <rect width="960" height="520" fill="#0d1117"/>
  <text x="480" y="42" fill="#f0f6fc" font-size="22" font-weight="700" text-anchor="middle">What the 24 skills help you do</text>

  <!-- central hub -->
  <circle cx="480" cy="270" r="66" fill="#12101f" stroke="#6366f1" stroke-width="2"/>
  <text x="480" y="264" fill="#8b8cf5" font-size="15" font-weight="700" text-anchor="middle">assistant</text>
  <text x="480" y="284" fill="#8b949e" font-size="11" text-anchor="middle">24 skills</text>

  <g font-size="13" text-anchor="middle">
    <!-- top left: AI digest -->
    <rect x="70" y="80" width="200" height="60" rx="10" fill="#161b22" stroke="#8957e5"/>
    <text x="170" y="106" fill="#f0f6fc">Weekly AI digest</text>
    <text x="170" y="124" fill="#8b949e" font-size="11">ai-digest</text>
    <!-- top right: daily briefing -->
    <rect x="690" y="80" width="200" height="60" rx="10" fill="#161b22" stroke="#d97757"/>
    <text x="790" y="106" fill="#f0f6fc">Daily briefing</text>
    <text x="790" y="124" fill="#8b949e" font-size="11">daily-digest</text>
    <!-- left: personal branding -->
    <rect x="40" y="240" width="200" height="60" rx="10" fill="#161b22" stroke="#388bfd"/>
    <text x="140" y="266" fill="#f0f6fc">Personal branding</text>
    <text x="140" y="284" fill="#8b949e" font-size="11">me</text>
    <!-- right: linkedin -->
    <rect x="720" y="240" width="200" height="60" rx="10" fill="#161b22" stroke="#0a7ea4"/>
    <text x="820" y="266" fill="#f0f6fc">LinkedIn toolkit</text>
    <text x="820" y="284" fill="#8b949e" font-size="11">linkedin · 13 sub-skills</text>
    <!-- bottom left: email -->
    <rect x="70" y="400" width="200" height="60" rx="10" fill="#161b22" stroke="#2ead33"/>
    <text x="170" y="426" fill="#f0f6fc">Email &amp; newsletters</text>
    <text x="170" y="444" fill="#8b949e" font-size="11">email · newsletter</text>
    <!-- bottom center: writing -->
    <rect x="380" y="420" width="200" height="60" rx="10" fill="#161b22" stroke="#d9a441"/>
    <text x="480" y="446" fill="#f0f6fc">Writing quality</text>
    <text x="480" y="464" fill="#8b949e" font-size="11">humanize · readability · word-stats</text>
    <!-- bottom right: visual -->
    <rect x="690" y="400" width="200" height="60" rx="10" fill="#161b22" stroke="#e5534b"/>
    <text x="790" y="426" fill="#f0f6fc">Visual artifacts</text>
    <text x="790" y="444" fill="#8b949e" font-size="11">pixel</text>
  </g>

  <g stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M430,230 L235,130"/>
    <path d="M530,230 L725,130"/>
    <path d="M416,270 L240,270"/>
    <path d="M544,270 L720,270"/>
    <path d="M432,308 L245,405"/>
    <path d="M480,336 L480,418"/>
    <path d="M528,308 L710,405"/>
  </g>
</svg>
